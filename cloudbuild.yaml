options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - name: 'node:20-slim' 
    entrypoint: 'npm'
    args: ['install']
    dir: 'blog-platform-frontend'

  - name: 'node:20-slim'
    entrypoint: 'npm'
    args: ['run', 'build']
    dir: 'blog-platform-frontend'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    args: 
      - gcloud
      - firebase
      - deploy
      - '--project=${PROJECT_ID}'
      - '--only=hosting'
    entrypoint: bash
timeout: 600s