<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Đăng ký</title>
    <link rel="stylesheet" href="auth.css">
</head>

<body>
    <div class="form-container">
        <h1>Tạo tài khoản mới</h1>
        <input type="email" id="email" placeholder="Email" required>
        <input type="text" id="display-name" placeholder="Tên hiển thị (duy nhất)" required>
        <input type="password" id="password" placeholder="Mật khẩu (ít nhất 6 ký tự)" required>
        <input type="password" id="password-confirm" placeholder="Xác nhận mật khẩu" required>
        <button id="btn-signup">Đăng ký</button>
        <p id="signup-message" class="message"></p>
        <p>Đã có tài khoản? <a href="/login.html">Đăng nhập</a></p>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="auth.js"></script>
</body>

</html>
